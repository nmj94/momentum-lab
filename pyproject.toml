[project]
name = "momentum-lab"
version = "0.1.0"
description = "Autonomous momentum strategy research - just provide a ticker, find the optimal strategy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Your Name"}]
keywords = ["trading", "momentum", "backtest", "strategy", "optimization", "gold", "stocks", "etf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/yourusername/momentum-lab"
Repository = "https://github.com/yourusername/momentum-lab"

[project.scripts]
momentum-lab = "momentum_lab.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momentum_lab"]
