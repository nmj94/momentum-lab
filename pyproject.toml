[project]
name = "momentum-research-lab"
version = "0.12.0"
description = "Reproducible momentum strategy research and parameter-sensitivity evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "nmj94", email = "niemj1994@gmail.com"}]
keywords = ["trading", "momentum", "backtest", "strategy", "optimization", "gold", "stocks", "etf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "platformdirs>=4.0",
    "tqdm>=4.65",
]

# Keep this extra in sync with [dependency-groups] dev below: pip installs
# use the extra, uv uses the dependency group (PEP 735).
[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
xgb = ["scikit-learn>=1.3", "xgboost>=2.0"]
all = ["scikit-learn>=1.3", "xgboost>=2.0"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.0",
    "hypothesis>=6.100",
    "coverage>=7.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.urls]
Homepage = "https://github.com/nmj94/momentum-lab"
Repository = "https://github.com/nmj94/momentum-lab"

[project.scripts]
momentum-lab = "momentum_lab.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# BLE001: broad Exception catching is intentional here - grid search and
# robustness checks must tolerate individual failing (strategy, params) combos.
extend-ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.0",
    "hypothesis>=6.100",
    "coverage>=7.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require internet access or a pre-populated data cache",
]

[tool.hatch.build.targets.wheel]
packages = ["momentum_lab"]
