name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --locked ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Run tests with coverage (offline)
        run: uv run --locked coverage run --source=momentum_lab -m pytest -m "not network" -q
      - name: Enforce coverage floor
        run: uv run --locked coverage report --fail-under=78
      - name: Compare frozen accounting benchmarks
        run: uv run --locked momentum-lab benchmark --output benchmark-results
      - name: Compare independent frozen portfolio ledgers
        run: uv run --locked momentum-lab portfolio benchmark
      - name: Compare independent membership and sealed-study ledgers
        run: uv run --locked momentum-lab portfolio study benchmark
      - name: Publish regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-benchmarks-python-${{ matrix.python-version }}
          path: benchmark-results/
          if-no-files-found: warn

  run-control-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Verify native ownership, interruption and workflow integration
        run: uv run --locked pytest tests/test_run_control.py tests/test_backups.py tests/test_portfolio_research.py tests/test_portfolio_study.py -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Install wheel into a clean environment
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/momentum-lab --version
          .wheel-venv/bin/python -c "import momentum_lab; assert momentum_lab.__version__ == '0.16.0'"
      - name: Verify packaged frozen fixtures outside the source checkout
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          benchmark_workspace="$(mktemp -d)"
          cd "$benchmark_workspace"
          "$wheel_python" -m momentum_lab benchmark --output results
          "$wheel_python" - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from momentum_lab import paired_block_bootstrap

          rng = np.random.Generator(np.random.PCG64(17))
          strategy = pd.Series(rng.normal(0.001, 0.01, 160))
          benchmark = strategy * 0.9 + pd.Series(rng.normal(0, 0.001, 160))
          result = paired_block_bootstrap(strategy, benchmark, n_resamples=200)
          assert result["status"] == "ok"
          assert result["statistics"]["annualized_mean_excess"]["ci"][0] is not None
          json.dumps(result, allow_nan=False)
          PY
      - name: Verify installed research governance without network data
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          governance_workspace="$(mktemp -d)"
          cd "$governance_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/governance_smoke.py"
      - name: Verify installed offline datasets and research lifecycle
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          dataset_workspace="$(mktemp -d)"
          cd "$dataset_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/dataset_smoke.py"
      - name: Verify installed multi-asset portfolio research
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          portfolio_workspace="$(mktemp -d)"
          cd "$portfolio_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/portfolio_smoke.py"
      - name: Verify installed portfolio study seal, reveal and replay
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          study_workspace="$(mktemp -d)"
          cd "$study_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/portfolio_study_smoke.py"
      - name: Verify installed run status, ownership and interrupted history
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          run_workspace="$(mktemp -d)"
          cd "$run_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/run_control_smoke.py"
      - name: Verify installed private backup and inactive restore
        run: |
          wheel_python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          backup_workspace="$(mktemp -d)"
          cd "$backup_workspace"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/backup_smoke.py"

  network-test:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Run provider contract tests
        run: uv run --locked pytest -m network -q
